AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Self-Healing DevOps Platform -- OBSERVE Pillar (Framework Only) Matches
  the professor''s deploy.sh scope exactly: deploys the OBSERVE compute + storage
  + all 5 pillar topics (pre-provisioned, ready for ANALYZE/DECIDE/ACT/COMMUNICATE
  to be added later), and nothing else. No business services are defined here -- those
  belong in a SEPARATE deployment, added independently by whoever''s application this
  framework is pointed at. This template has zero knowledge of any specific client''s
  services, matching the professor''s own project, which never named a business service
  anywhere either.

  '
Parameters:
  SshAllowedIp:
    Type: String
    Description: Your public IP in CIDR form, e.g. 203.0.113.5/32 -- for the demo
      EC2 instance's SSH access
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: VPC CIDR range -- adjust to match your actual VPC
Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        REGION: us-east-1
  Api:
    Cors:
      AllowMethods: '''POST,GET,OPTIONS'''
      AllowHeaders: '''Content-Type'''
      AllowOrigin: '''*'''
Resources:
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: '''POST,GET,OPTIONS'''
        AllowHeaders: '''Content-Type'''
        AllowOrigin: '''*'''
  ObserveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ObserveFunction
      Handler: main.lambda_handler
      FunctionName: self-healing-observe
      Timeout: 300
      Tracing: Active
      Environment:
        Variables:
          TABLE_NAME:
            Ref: IncidentsTable
          SNS_TOPIC_ARN:
            Ref: ObserveTopic
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: IncidentsTable
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - ObserveTopic
            - TopicName
      - Statement:
        - Effect: Allow
          Action:
          - logs:DescribeLogGroups
          - logs:FilterLogEvents
          - logs:GetLogEvents
          - cloudwatch:ListMetrics
          - cloudwatch:GetMetricStatistics
          - xray:GetTraceSummaries
          - xray:BatchGetTraces
          Resource: '*'
      Events:
        ObservePost:
          Type: Api
          Properties:
            Path: /observe
            Method: post
            RestApiId:
              Ref: MyApi
        IncidentsGet:
          Type: Api
          Properties:
            Path: /incidents
            Method: get
            RestApiId:
              Ref: MyApi
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
    Metadata:
      SamResourceId: ObserveFunction
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: self-healing-incidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the demo EC2 instance
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp:
          Ref: SshAllowedIp
  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: CloudWatchAgentPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - cloudwatch:PutMetricData
            - ec2:DescribeVolumes
            - ec2:DescribeTags
            - logs:PutLogEvents
            - logs:CreateLogGroup
            - logs:CreateLogStream
            Resource: '*'
  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - Ref: DemoInstanceRole
  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0c101f26f147fa7fd
      IamInstanceProfile:
        Ref: DemoInstanceProfile
      SecurityGroupIds:
      - Ref: DemoSecurityGroup
      Tags:
      - Key: Name
        Value: self-healing-demo-instance
      UserData:
        Fn::Base64:
          Fn::Sub: '#!/bin/bash

            yum update -y

            yum install -y amazon-cloudwatch-agent

            # No specific workload installed here on purpose -- this

            # instance exists purely so CPUUtilization/NetworkIn have

            # real data. Put whatever workload you actually want on

            # it (the earlier self-hosted LLM idea still applies if

            # you want it doing real work, not just idling).

            '
  ObserveTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: self-healing-observe
  AnalyzeTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: self-healing-analyze
  DecideTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: self-healing-decide
  ActTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: self-healing-act
  CommunicateTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: self-healing-communicate
Outputs:
  ApiUrl:
    Description: Base URL for the OBSERVE API
    Value:
      Fn::Sub: https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  ObserveTopicArn:
    Description: Topic incidents are published to -- ANALYZE subscribes here when
      built
    Value:
      Ref: ObserveTopic
  DemoInstanceId:
    Description: The EC2 instance backing AWS/EC2:CPUUtilization and NetworkIn discovery
    Value:
      Ref: DemoInstance
